[package]
name = "computer-use-mcp-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Remote MCP gateway for computer-use backends"
license = "MIT"
repository = "https://github.com/git-ksk/computer-use-mcp-gateway"
keywords = ["mcp", "computer-use", "gateway", "automation", "rust"]
categories = ["network-programming"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
rmcp = { version = "=3.1.2", features = [
  "client",
  "server",
  "transport-child-process",
  "transport-streamable-http-server"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "sync", "net", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
pretty_assertions = "1"
