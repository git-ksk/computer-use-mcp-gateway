[package]
name = "computer-use-mcp-gateway"
default-run = "computer-use-mcp-gateway"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Remote MCP gateway for computer-use backends"
license = "MIT"
repository = "https://github.com/git-ksk/computer-use-mcp-gateway"
keywords = ["mcp", "computer-use", "gateway", "automation", "rust"]
categories = ["network-programming"]

[dependencies]
anyhow = "1"
base64 = "0.23"
async-trait = "0.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
fs2 = "0.4"
rand = "0.8"
ring = "0.17.14"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
rmcp = { version = "=3.1.2", features = [
  "client",
  "server",
  "transport-child-process",
  "transport-streamable-http-server"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "sync", "net", "time"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
x509-parser = "0.18.1"
tonic = { version = "0.14.6", features = ["transport", "tls-ring"] }
prost = "0.14"
tonic-prost = "0.14.6"
tokio-stream = { version = "0.1", features = ["net"] }
process-wrap = { version = "10.0.0", default-features = false, features = ["std", "process-group", "job-object"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.32.0", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["grpc-tonic", "tls-webpki-roots", "trace", "metrics"] }
tracing-opentelemetry = { version = "0.33.0", default-features = false }
portable-pty = "0.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_SystemServices",
  "Win32_System_Threading"
] }
[dev-dependencies]
pretty_assertions = "1"
proptest = "1"
rcgen = "0.14"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14.6"
