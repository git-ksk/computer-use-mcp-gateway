name: V2 source audit

on:
  push:
    branches:
      - feat/v2-browser-semantic-parity
    paths:
      - .github/workflows/v2-source-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Heartbeat and transfer insertion points
        shell: bash
        run: |
          set -euo pipefail
          echo '=== heartbeat symbols ==='
          grep -n -E 'pending_heartbeat|heartbeat_interval|HeartbeatAck|heartbeat.*deadline' src/v2_m1_agent.rs || true
          echo '=== agent heartbeat context ==='
          grep -n -B18 -A35 'pending_heartbeat' src/v2_m1_agent.rs || true
          echo '=== northbound browser symbols ==='
          grep -n -E 'TOOL_BROWSER_|browser_(prepare|bind|inspect|navigate|click|type|dialog|pointer)|ScopedBackendRefRegistry|invalidate_context' src/v2_m1_northbound.rs | head -n 260 || true
          echo '=== browser upload references ==='
          grep -R -n -E 'BrowserUpload|UploadFile|staged_files|browser_set_input_files|destination_root_ref|BrowserDownload' src tests docs | head -n 500 || true
          echo '=== agent lifecycle / state dirs ==='
          grep -n -E 'state_dir|end_interaction_session|cleanup|invalidate|Filesystem' src/v2_m1_agent.rs | head -n 220 || true
