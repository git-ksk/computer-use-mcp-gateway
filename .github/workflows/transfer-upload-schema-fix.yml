name: Browser upload schema fix

on:
  push:
    branches:
      - feat/v2-browser-semantic-parity
    paths:
      - .github/workflows/transfer-upload-schema-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: feat/v2-browser-semantic-parity

      - name: Patch exact Cua 0.19.3 upload field
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/v2_browser_cua.rs')
          text = path.read_text()
          old_mapper = '        "paths".into(),\n        Value::Array(files.iter().map(|path| json!(path.as_str())).collect()),\n'
          new_mapper = '        "files".into(),\n        Value::Array(files.iter().map(|path| json!(path.as_str())).collect()),\n'
          if text.count(old_mapper) != 1:
              raise SystemExit('expected exactly one upload mapper paths field')
          text = text.replace(old_mapper, new_mapper, 1)
          old_test = 'assert_eq!(call.arguments()["paths"], json!(["/tmp/proven-upload.txt"]));'
          new_test = 'assert_eq!(call.arguments()["files"], json!(["/tmp/proven-upload.txt"]));\n        assert!(!call.arguments().contains_key("paths"));'
          if text.count(old_test) != 1:
              raise SystemExit('expected exactly one upload mapper paths assertion')
          path.write_text(text.replace(old_test, new_test, 1))
          PY

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0

      - name: Format
        run: cargo fmt

      - name: Diff check
        run: git diff --check

      - name: Check
        run: cargo check --locked --all-targets

      - name: Targeted test
        run: cargo test --locked v2_browser_cua::tests::upload_never_accepts_arbitrary_paths_from_the_browser_request -- --exact

      - name: Full test
        run: cargo test --locked

      - name: Commit verified fix and remove workflow
        run: |
          git rm .github/workflows/transfer-upload-schema-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v2_browser_cua.rs
          git commit -m "fix(v2): match Cua browser upload files schema"
          git push origin HEAD:feat/v2-browser-semantic-parity
