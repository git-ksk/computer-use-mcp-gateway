name: Finalize usage seam removal (temporary)

on:
  push:
    branches:
      - refactor/remove-usage-seam

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/remove-usage-seam
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
      - name: Remove built-in usage runtime seam
        run: python .github/scripts/remove_usage_seam_temp.py
      - name: Remove usage-specific docs and packaging
        run: python .github/scripts/cleanup_usage_docs_temp.py
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Docs
        run: python3 scripts/check_docs.py
      - name: Diff check
        run: git diff --check
      - name: Verify core seam is gone and #131 remains
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'CUMG_V2_USAGE|mcp-usage-control|MCPUsage|NoopUsageController|UsageController|UsageLease|UsageManager|UsageSettlement|UsageOperation|V2_USAGE_ACCOUNTING|usage-sidecar|usage\.env\.example' -- \
            ':!.github/scripts/remove_usage_seam_temp.py' \
            ':!.github/scripts/cleanup_usage_docs_temp.py' \
            ':!.github/workflows/usage-seam-finalize-temp.yml'; then
            echo 'first-party usage seam references remain' >&2
            exit 1
          fi
          grep -q 'mark_dispatched_with_binding' src/v2_m1_hub.rs
          grep -q 'reconciliation_commits_candidate_before_live_clear_and_has_no_dispatch_path' src/v2_m1_hub.rs
          grep -q 'ReconciliationStatus::AutoReconciling' src/v2_m1_hub.rs
      - name: Commit validated removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(v2): externalize usage control from gateway core'
          git push origin HEAD:refactor/remove-usage-seam
