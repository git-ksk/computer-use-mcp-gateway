name: Final online recovery gate

on:
  push:
    branches: [feat/local-user-online-recovery]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/local-user-online-recovery

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0

      - name: Apply final hardening and docs patch
        run: python3 scripts/finalize_online_recovery.py

      - name: Format
        run: cargo fmt --all

      - name: Check
        run: cargo check --locked --all-targets

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Documentation links
        run: python3 scripts/check_docs.py

      - name: Diff check
        run: git diff --check

      - name: Commit final implementation
        run: |
          git rm scripts/finalize_online_recovery.py .github/workflows/online-recovery-finalize.yml
          git add src tests docs packaging
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat(v2): harden local-user online recovery"
          git push origin HEAD:feat/local-user-online-recovery
