name: V2 P1 Validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0

      - name: Normalize code and canonical P1 docs
        shell: bash
        run: |
          cargo fmt
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"anchor missing in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          def append_once(path, marker, block):
              p = Path(path)
              text = p.read_text()
              if marker in text:
                  return
              p.write_text(text.rstrip() + "\n\n" + block.strip() + "\n")

          replace_once(
              "docs/V2_P0_EXECUTION_SAFETY.md",
              "Status: **P0 accepted on 2026-08-12; P1 follow-ups remain open.**",
              "Status: **P0 accepted on 2026-08-12; P1 fixed-set multi-device and materially different second-backend proofs are implemented, while the physical real-Cua P1 rerun remains open.**",
          )
          replace_once(
              "docs/V2_P0_EXECUTION_SAFETY.md",
              "- **P1 multi-device invariant proof.** The authoritative controller remains exercised through the existing single-device Hub runtime; independent Device A/Device B quarantine behavior still requires a later minimal multi-device proof before fleet work.\n- **P1 second materially different backend.** The deterministic Cua-shaped fixture proves the Cua adapter execution boundary and cancellation races, but it is not a second backend with a different evidence contract.",
              "- **P1 fixed-set multi-device invariant proof — completed.** `v2_multi_device::FixedMultiDeviceHub` composes an immutable explicitly provisioned set of ordinary `SingleDeviceHub` instances. Every device keeps its own P0 controller, checkpoint directory, queue, session generation, and gRPC service; there is no shared fleet registry, discovery plane, or cross-device scheduler. `tests/v2_p1_invariants.rs` and `tests/v2_p1_multi_device_e2e.rs` cover A ambiguous/B executing, A partition/B normal, Hub restart with A quarantined, isolated generation advance, competing principals, stale/late settlement, and no replay.\n- **P1 second materially different backend — completed.** `v2_reference_backend::DeterministicReferenceExecutor` is a process-like in-process executor rather than a Cua-shaped mock. It can prove pre-commit non-start or clean local termination, and deliberately returns `Indeterminate` when post-commit outcome cannot be proven. `tests/v2_p1_backend_portability.rs` routes both Cua ambiguity and the reference executor through the same authoritative operation controller.\n- **P1 physical real-Cua rerun — still open.** The existing real-Cua acceptance is main-only on the trusted TCC-granted macOS runner. P1 does not claim a fresh physical-desktop rerun until that lane is executed on the final code; deterministic Cua regression remains in normal CI.",
          )
          append_once(
              "docs/V2_P0_EXECUTION_SAFETY.md",
              "## 13. P1 proof boundary",
              '''
          ## 13. P1 proof boundary

          P1 deliberately leaves the P0 authoritative state machine unchanged. The multi-device layer is composition only: an exact stable device ID selects one pre-provisioned `SingleDeviceHub`, and construction rejects shared checkpoint directories. A quarantined Device A therefore cannot transfer ownership, queue state, generation, resolution, or replay eligibility into Device B. There is no mutable enrollment or failover route that can silently substitute a different device.

          The second-backend proof is also adapter-only. A backend may produce an ordinary terminal outcome only when its contract supplies evidence equivalent to the existing P0 evidence classes. The deterministic reference executor can prove not-started or clean local termination; after its commit boundary, an unprovable cancellation is always classified as `Indeterminate`. Cua retains its conservative post-provider cancellation semantics. Neither backend owns or forks a second operation state machine.

          P1 security review also keeps the compromised-backend boundary explicit: an authenticated but compromised Agent/backend can still lie about claimed terminal evidence or act outside the protocol. CUMG prevents stale ownership, cross-device replay, and accidental ambiguity collapse among protocol-conforming components; it does not provide Byzantine attestation of arbitrary desktop effects.

          The fixed-set proof is intentionally not a fleet product. Shared-endpoint discovery, mutable device registration, generic failover routing, fleet UX, a new policy language, native GUI expansion, and a ROSClaw fork remain out of scope.
          ''',
          )

          append_once(
              "docs/V2_POSITIONING.md",
              "### P1 proof status — fixed-set composition only",
              '''
          ### P1 proof status — fixed-set composition only

          The P1 proof implements the minimum composition required by Priorities 4 and 5 without changing the P0 operation state machine. `FixedMultiDeviceHub` is an immutable map of explicitly provisioned stable device IDs to existing `SingleDeviceHub` services/handles, with a distinct checkpoint directory per device. It is not device discovery, a fleet registry, a shared scheduler, or a product routing plane.

          The proof demonstrates that Device A may remain durably quarantined under one principal while Device B continues native shell work under another principal; A reconnect advances only A's generation; A partition does not block B; Hub reconstruction restores the two checkpoints independently; and the old ambiguous A operation is never automatically replayed. Stale/wrong-owner settlement is rejected by the unchanged P0 fences.

          Backend portability is proved with a deterministic process-like reference executor whose cancellation/result contract materially differs from Cua. Proven not-started/clean termination may map to an existing terminal evidence class; an unprovable post-commit outcome maps to `indeterminate`. The same operation identity, owner, generation, quarantine, explicit resolution, receipt, and no-replay core is used for both backends.

          A fresh physical real-Cua P1 rerun remains an acceptance follow-up because that lane is intentionally main-only on the trusted macOS desktop runner. This does not justify broadening P1 into fleet or backend product work.
          ''',
          )

          roadmap = Path("docs/ROADMAP.md")
          text = roadmap.read_text()
          p1_items = [
              "Device A enters `indeterminate` after an ambiguous state-changing action and remains quarantined.",
              "Device B remains independently usable by another authorized principal.",
              "Another principal cannot acquire, inherit, or replace Device A's unresolved ownership.",
              "Hub restart preserves independent A/B state.",
              "reconnect/failover does not replay Device A's ambiguous operation.",
              "stale device/Agent/capability generations cannot route or finalize old work.",
              "queues/load shedding do not bypass per-device ownership invariants.",
          ]
          for item in p1_items:
              text = text.replace(f"[ ] {item}", f"[x] {item}", 1)
          portability = [
              "integrate a second backend or deterministic reference executor with materially different cancellation/result behavior;",
              "require adapters to provide evidence for terminal versus ambiguous classification;",
              "prove the operation-state machine remains unchanged across backends;",
              "map unsupported evidence conservatively to `indeterminate` rather than backend-specific guesses.",
          ]
          for item in portability:
              text = text.replace(f"- [ ] {item}", f"- [x] {item}", 1)
          marker = "P1 fixed-set proof accepted boundary:"
          if marker not in text:
              anchor = "A machine registry, device list, or successful routing to two machines is **not** sufficient M2 acceptance evidence."
              note = anchor + "\n\nP1 fixed-set proof accepted boundary: the implementation composes existing per-device P0 Hubs with independent checkpoints and no shared fleet scheduler. A fresh physical real-Cua P1 rerun remains open on the trusted main-only desktop lane and must not be inferred from deterministic CI."
              if anchor not in text:
                  raise SystemExit("ROADMAP M2 anchor missing")
              text = text.replace(anchor, note, 1)
          roadmap.write_text(text)

          append_once(
              "docs/SECURITY.md",
              "## V2 P1 fixed-set multi-device security review",
              '''
          ## V2 P1 fixed-set multi-device security review

          P1 adds only fixed composition around the P0 core. The security review covers the requested cross-device failure classes:

          - **cross-device ownership bleed:** each device owns a separate `SingleDeviceHub`, authoritative controller, checkpoint directory, queue, live session and generation. No API transfers an unresolved operation or quarantine between entries;
          - **device ID / generation confusion:** routing requires an exact pre-provisioned stable device ID, while the selected P0 service still verifies its provisioned device identity, signed session material, operation identity, capability revision and generation. A reconnect advances only that device's generation;
          - **stale routing:** the fixed map is immutable after construction. There is no discovery, reassignment or failover-to-another-device operation that could route an old A result into B;
          - **shared/global queue bypass:** P1 introduces no shared queue. Admission/load shedding remains inside each existing per-device Hub, so A's quarantine cannot be bypassed through B's capacity or queue;
          - **checkpoint restore consistency:** construction rejects duplicate state directories. Hub restart reconstructs each P0 checkpoint independently; failure to restore one device is not interpreted as permission to inherit another device's state;
          - **duplicate/late result or cancellation acknowledgement:** the unchanged P0 operation/owner/generation fences reject stale settlement and duplicate finalization; separate service instances additionally prevent a signed A stream from becoming B's execution stream;
          - **resolution target confusion:** recovery is invoked through the exact device's `HubHandle` and the exact ambiguous operation ID. There is no fleet-wide lookup that can resolve a same-looking operation on another device;
          - **compromised backend evidence:** unchanged trust boundary. A malicious authenticated Agent/backend may falsely claim terminal evidence or perform side effects outside CUMG. The reference executor proves adapter classification rules for conforming backends; it is not remote attestation or Byzantine proof.

          The proof intentionally does not add generic authorization, mutable device enrollment/discovery, a fleet scheduler, new policy language, native GUI backends, or a ROSClaw fork.
          ''',
          )

          append_once(
              "docs/TESTING.md",
              "### V2 P1 multi-device and backend-portability proof",
              '''
          ### V2 P1 multi-device and backend-portability proof

          In addition to the repository-wide locked gate, run:

          ```bash
          cargo test --locked --test v2_p1_invariants
          cargo test --locked --test v2_p1_backend_portability
          cargo test --locked --test v2_p1_multi_device_e2e
          ```

          `v2_p1_invariants` proves independent A/B ownership/quarantine state, restart normalization, queue cancellation on the quarantined device, wrong-owner/late/duplicate settlement rejection, and property-based stale-generation isolation.

          `v2_p1_backend_portability` uses a deterministic process-like second executor whose cancellation semantics can prove not-started or clean termination and can also deliberately become post-commit indeterminate. It verifies that both this executor and Cua ambiguity use the same P0 operation ID/owner/generation/quarantine/resolution/no-replay model.

          `v2_p1_multi_device_e2e` composes two existing `SingleDeviceHub` services in one process with independent durable state. Device A uses the Cua-shaped GUI fixture and becomes unknown/quarantined; Device B simultaneously runs native shell work under a different principal; A reconnect and partition leave B usable; Hub reconstruction restores A/B independently; explicit A resolution permits a new operation while marker counts prove the old GUI action was not replayed.

          A fresh physical real-Cua P1 regression is **not** claimed by these deterministic lanes. The operator-controlled TCC-granted macOS workflow remains main-only by design; keep that item open until the final P1 code is exercised there.
          ''',
          )
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests docs
            git commit -m "chore(v2): format P1 proof and update canonical docs"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Format
        run: cargo fmt --check

      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Test all targets
        run: cargo test --locked --all-targets

      - name: Clippy all targets
        run: cargo clippy --locked --all-targets

      - name: P1 multi-device invariants
        run: cargo test --locked --test v2_p1_invariants

      - name: P1 second-backend conformance
        run: cargo test --locked --test v2_p1_backend_portability

      - name: P1 multi-device crash partition E2E
        run: cargo test --locked --test v2_p1_multi_device_e2e

      - name: Docs check
        run: python3 scripts/check_docs.py
