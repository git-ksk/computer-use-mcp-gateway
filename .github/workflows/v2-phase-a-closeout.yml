name: V2 Phase A finalize

on:
  push:
    branches:
      - feat/v2-browser-semantic-parity
    paths:
      - .github/workflows/v2-phase-a-closeout.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: feat/v2-browser-semantic-parity
          fetch-depth: 0

      - name: Restore strict fixture semantics
        run: |
          sed -i 's/heartbeat_interval: Duration::from_millis(500)/heartbeat_interval: Duration::from_millis(50)/' tests/v2_m1_partition_recovery.rs
          sed -i '/Recovery semantics are the subject of this E2E, not a 150 ms ACK deadline/d' tests/v2_m1_partition_recovery.rs
          sed -i '/Keep the Agent cadence above hosted-runner\/fsync scheduling jitter without/d' tests/v2_m1_partition_recovery.rs
          sed -i '/changing production heartbeat semantics\./d' tests/v2_m1_partition_recovery.rs
          grep -q 'heartbeat_interval: Duration::from_millis(50)' tests/v2_m1_partition_recovery.rs
          ! grep -q 'heartbeat_interval: Duration::from_millis(500)' tests/v2_m1_partition_recovery.rs

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0

      - name: Validate final Phase A patch
        run: |
          cargo fmt --all -- --check
          cargo test --locked --test v2_m1_partition_recovery
          cargo test --locked --test v2_p1_multi_device_e2e
          git diff --check

      - name: Commit Phase A closeout
        run: |
          git rm -f .github/workflows/v2-phase-a-closeout.yml .github/workflows/v2-source-audit.yml .github/workflows/v2-phase-a-correct-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/v2_m1_partition_recovery.rs
          git commit -m "fix(v2): close recovery E2E synchronization race"
          git push origin HEAD:feat/v2-browser-semantic-parity
