name: V2 Phase A closeout

on:
  push:
    branches:
      - feat/v2-browser-semantic-parity
    paths:
      - .github/workflows/v2-phase-a-closeout.yml

permissions:
  contents: read

jobs:
  recovery-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - name: Exact targeted tests
        env:
          RUST_BACKTRACE: "1"
        run: |
          cargo test --locked --test v2_m1_partition_recovery -- --nocapture
          cargo test --locked --test v2_p1_multi_device_e2e -- --nocapture

      - name: Repeat partition recovery 50x
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          for i in $(seq 1 50); do
            echo "===== partition iteration $i ====="
            cargo test --locked --test v2_m1_partition_recovery -- --nocapture
          done

      - name: Repeat multi-device recovery 50x
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          for i in $(seq 1 50); do
            echo "===== multi-device iteration $i ====="
            cargo test --locked --test v2_p1_multi_device_e2e -- --nocapture
          done
