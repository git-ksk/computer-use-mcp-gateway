name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0

      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test

  cua-smoke:
    name: Cua smoke (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            python: python3
          - name: macOS
            os: macos-latest
            python: python3
          - name: Windows
            os: windows-latest
            python: python
    runs-on: ${{ matrix.os }}
    env:
      # Pin the upstream compatibility target so CI does not change beneath a commit.
      CUA_DRIVER_RS_VERSION: "0.19.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - name: Install Cua runtime dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 at-spi2-core

      - name: Install Cua Driver (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          /bin/bash -c "$(curl -fsSL https://cua.ai/driver/install.sh)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Cua Driver (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Invoke-RestMethod https://cua.ai/driver/install.ps1
          & ([scriptblock]::Create($installer)) -NoAutoStart
          "$env:LOCALAPPDATA\Programs\Cua\cua-driver\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Cua Driver and disable telemetry
        shell: bash
        run: |
          cua-driver --version
          cua-driver telemetry disable

      - name: Build gateway
        shell: bash
        run: cargo build

      - name: Real Cua MCP gateway smoke
        shell: bash
        run: ${{ matrix.python }} scripts/cua_gateway_smoke.py
