name: V2 P1 Validation Fixup

# Temporary validation-only workflow. Revision 5: separate partition proof from Agent-process restart.
on:
  pull_request:

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply P1 Hub-restart fixture lifecycle fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tests/v2_p1_multi_device_e2e.rs")
          text = p.read_text()

          crash_marker = "\n    // Crash the remaining Hub route, then reconstruct the fixed set from the two\n"
          stop_block = '''
              // The partition invariant is now proven. Stop this Agent process cleanly
              // before the Hub crash. The restart phase then proves recovery from the
              // same durable Agent checkpoint independently of tonic abort classification.
              let _ = a2_shutdown_tx.send(true);
              let _ = a_task.await;
          '''
          if "let _ = a2_shutdown_tx.send(true);" not in text:
              if crash_marker not in text:
                  raise SystemExit("partition crash marker missing")
              text = text.replace(crash_marker, stop_block + crash_marker, 1)

          generation_marker = "\n    let a_generation_after_hub_restart =\n"
          restart_block = '''
              // Recreate A from its durable Agent checkpoint after the Hub is back. The
              // earlier phase already proved isolated reconnect while B kept its generation.
              let mut restarted_agent_a = AgentService::new(config_a.clone(), material_a.clone())?;
              let (a3_shutdown_tx, a3_shutdown_rx) = watch::channel(false);
              a_task = tokio::spawn(async move { restarted_agent_a.run(a3_shutdown_rx).await });
          '''
          if "let (a3_shutdown_tx, a3_shutdown_rx)" not in text:
              if generation_marker not in text:
                  raise SystemExit("post-restart generation marker missing")
              text = text.replace(generation_marker, restart_block + generation_marker, 1)

          old_cleanup = "    a2_shutdown_tx.send(true)?;\n    b_shutdown_tx.send(true)?;"
          new_cleanup = "    a3_shutdown_tx.send(true)?;\n    b_shutdown_tx.send(true)?;"
          if old_cleanup in text:
              text = text.replace(old_cleanup, new_cleanup, 1)
          elif new_cleanup not in text:
              raise SystemExit("cleanup sender anchor missing")

          p.write_text(text)
          PY
          cargo fmt
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/v2_p1_multi_device_e2e.rs
            git commit -m "test(v2): separate partition and restart Agent lifecycles"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
