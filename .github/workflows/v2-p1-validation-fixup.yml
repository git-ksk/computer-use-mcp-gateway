name: V2 P1 Validation Fixup

# Temporary validation-only workflow. Revision 10: rerun acceptance after fixture stabilization.
on:
  pull_request:

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Verify stabilization is already applied
        shell: bash
        run: |
          grep -q 'AgentService::new(config_b.clone(), material_b.clone())' tests/v2_p1_multi_device_e2e.rs
          grep -q 'b2_shutdown_tx' tests/v2_p1_multi_device_e2e.rs
          grep -q 'Duration::from_secs(6)' tests/v2_m1_partition_recovery.rs
