name: V2 P1 Validation Fixup

# Temporary validation-only workflow. Revision 9: make both Agent restart phases explicit.
on:
  pull_request:

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Stabilize P1 restart fixture and existing partition fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("tests/v2_p1_multi_device_e2e.rs")
          text = p.read_text()

          old = "let mut agent_b = AgentService::new(config_b, material_b)?;"
          new = "let mut agent_b = AgentService::new(config_b.clone(), material_b.clone())?;"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("B Agent construction anchor missing")

          abort_anchor = "server_b.abort();\n    let _ = server_b.await;\n    drop(handle_a);"
          abort_new = "server_b.abort();\n    let _ = server_b.await;\n    let _ = b_shutdown_tx.send(true);\n    let _ = b_task.await;\n    drop(handle_a);"
          if abort_anchor in text:
              text = text.replace(abort_anchor, abort_new, 1)
          elif abort_new not in text:
              raise SystemExit("B Hub-crash lifecycle anchor missing")

          restart_a_anchor = (
              "let mut restarted_agent_a = AgentService::new(config_a.clone(), material_a.clone())?;\n"
              "    let (a3_shutdown_tx, a3_shutdown_rx) = watch::channel(false);\n"
              "    a_task = tokio::spawn(async move { restarted_agent_a.run(a3_shutdown_rx).await });\n\n"
              "    let a_generation_after_hub_restart ="
          )
          restart_b_block = (
              "let mut restarted_agent_a = AgentService::new(config_a.clone(), material_a.clone())?;\n"
              "    let (a3_shutdown_tx, a3_shutdown_rx) = watch::channel(false);\n"
              "    a_task = tokio::spawn(async move { restarted_agent_a.run(a3_shutdown_rx).await });\n"
              "    let mut restarted_agent_b = AgentService::new(config_b.clone(), material_b.clone())?;\n"
              "    let (b2_shutdown_tx, b2_shutdown_rx) = watch::channel(false);\n"
              "    let b_task = tokio::spawn(async move { restarted_agent_b.run(b2_shutdown_rx).await });\n\n"
              "    let a_generation_after_hub_restart ="
          )
          if restart_a_anchor in text:
              text = text.replace(restart_a_anchor, restart_b_block, 1)
          elif "let (b2_shutdown_tx, b2_shutdown_rx)" not in text:
              raise SystemExit("B post-restart Agent anchor missing")

          cleanup_old = "a3_shutdown_tx.send(true)?;\n    b_shutdown_tx.send(true)?;"
          cleanup_new = "a3_shutdown_tx.send(true)?;\n    b2_shutdown_tx.send(true)?;"
          if cleanup_old in text:
              text = text.replace(cleanup_old, cleanup_new, 1)
          elif cleanup_new not in text:
              raise SystemExit("B cleanup sender anchor missing")
          p.write_text(text)

          q = Path("tests/v2_m1_partition_recovery.rs")
          existing = q.read_text()
          marker_old = "tokio::time::timeout(Duration::from_secs(3), async {\n        while !effect_marker.is_file()"
          marker_new = "tokio::time::timeout(Duration::from_secs(6), async {\n        while !effect_marker.is_file()"
          if marker_old in existing:
              existing = existing.replace(marker_old, marker_new, 1)
          elif marker_new not in existing:
              raise SystemExit("P0 partition marker timeout anchor missing")
          q.write_text(existing)
          PY
          cargo fmt
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/v2_p1_multi_device_e2e.rs tests/v2_m1_partition_recovery.rs
            git commit -m "test(v2): stabilize multi-device restart proof"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
