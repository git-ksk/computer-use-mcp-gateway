name: V2 P1 Validation Fixup

# Temporary validation-only workflow. Revision 4: separate partition proof from Agent-process restart.
on:
  pull_request:

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply P1 Hub-restart fixture lifecycle fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tests/v2_p1_multi_device_e2e.rs")
          text = p.read_text()

          stop_anchor = '''        Some((ambiguous_a.clone(), alice.clone(), a_generation))
              );

              // Crash the remaining Hub route'''
          stop_new = '''        Some((ambiguous_a.clone(), alice.clone(), a_generation))
              );

              // The partition invariant is now proven. Stop this Agent process cleanly
              // before the Hub crash. The restart phase then proves recovery from the
              // same durable Agent checkpoint independently of tonic abort classification.
              let _ = a2_shutdown_tx.send(true);
              let _ = a_task.await;

              // Crash the remaining Hub route'''
          if stop_anchor in text:
              text = text.replace(stop_anchor, stop_new, 1)
          elif "let _ = a2_shutdown_tx.send(true);" not in text:
              raise SystemExit("partition stop anchor missing")

          reconnect_anchor = '''    let a_generation_after_hub_restart =
              wait_new_generation(&handle_a, a_generation_after_reconnect)'''
          reconnect_new = '''    // Recreate A from its durable Agent checkpoint after the Hub is back. The
              // earlier phase already proved isolated reconnect while B kept its generation.
              let mut restarted_agent_a = AgentService::new(config_a.clone(), material_a.clone())?;
              let (a3_shutdown_tx, a3_shutdown_rx) = watch::channel(false);
              a_task = tokio::spawn(async move { restarted_agent_a.run(a3_shutdown_rx).await });

              let a_generation_after_hub_restart =
              wait_new_generation(&handle_a, a_generation_after_reconnect)'''
          if reconnect_anchor in text:
              text = text.replace(reconnect_anchor, reconnect_new, 1)
          elif "let (a3_shutdown_tx, a3_shutdown_rx)" not in text:
              raise SystemExit("post-restart reconnect anchor missing")

          if "    a2_shutdown_tx.send(true)?;\n    b_shutdown_tx.send(true)?;" in text:
              text = text.replace(
                  "    a2_shutdown_tx.send(true)?;\n    b_shutdown_tx.send(true)?;",
                  "    a3_shutdown_tx.send(true)?;\n    b_shutdown_tx.send(true)?;",
                  1,
              )
          elif "a3_shutdown_tx.send(true)?;" not in text:
              raise SystemExit("cleanup sender anchor missing")

          p.write_text(text)
          PY
          cargo fmt
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/v2_p1_multi_device_e2e.rs
            git commit -m "test(v2): separate partition and restart Agent lifecycles"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
