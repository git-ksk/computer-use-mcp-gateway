name: V2 P1 Validation Fixup

on:
  pull_request:

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply known E2E fixture fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tests/v2_p1_multi_device_e2e.rs")
          text = p.read_text()

          replacements = [
              (
                  ".start_command_as(bob.clone(), DeviceCommand::ScreenGeometry)\n            .await,",
                  ".start_command_as(bob.clone(), DeviceCommand::ScreenGeometry)\n            .await?\n            .wait()\n            .await,",
              ),
              (
                  "agent_material(\n        device_a_identity,",
                  "agent_material(\n        device_a_identity.clone(),",
              ),
              (
                  "agent_material(device_b_identity, &hub_b_identity, &grants_b, cert_der)",
                  "agent_material(device_b_identity.clone(), &hub_b_identity, &grants_b, cert_der)",
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"E2E fixup anchor missing: {old!r}")
          p.write_text(text)
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/v2_p1_multi_device_e2e.rs
            git commit -m "test(v2): fix P1 multi-device fixture ownership"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
