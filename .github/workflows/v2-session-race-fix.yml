name: V2 session liveness fix

on:
  push:
    branches:
      - feat/v2-browser-semantic-parity
    paths:
      - .github/workflows/v2-session-race-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: feat/v2-browser-semantic-parity

      - name: Patch Agent heartbeat ACK floor and exact Cua upload schema
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one marker, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          agent = "src/v2_m1_agent.rs"
          replace_once(
              agent,
              "const GRPC_QUEUE_DEPTH: usize = 8;\n",
              "const GRPC_QUEUE_DEPTH: usize = 8;\n"
              "const MIN_HEARTBEAT_ACK_DEADLINE: Duration = Duration::from_secs(1);\n\n"
              "fn heartbeat_ack_deadline(interval: Duration) -> Duration {\n"
              "    interval\n"
              "        .saturating_mul(3)\n"
              "        .max(MIN_HEARTBEAT_ACK_DEADLINE)\n"
              "}\n",
          )
          replace_once(
              agent,
              "        let heartbeat_deadline = self.config.heartbeat_interval.saturating_mul(3);\n",
              "        let heartbeat_deadline = heartbeat_ack_deadline(self.config.heartbeat_interval);\n",
          )
          replace_once(
              agent,
              "mod tests {\n    use super::*;\n\n",
              "mod tests {\n    use super::*;\n\n"
              "    #[test]\n"
              "    fn heartbeat_ack_deadline_has_a_scheduler_tolerance_floor() {\n"
              "        assert_eq!(\n"
              "            heartbeat_ack_deadline(Duration::from_millis(50)),\n"
              "            Duration::from_secs(1)\n"
              "        );\n"
              "        assert_eq!(\n"
              "            heartbeat_ack_deadline(Duration::from_secs(5)),\n"
              "            Duration::from_secs(15)\n"
              "        );\n"
              "    }\n\n",
          )

          cua = "src/v2_browser_cua.rs"
          replace_once(
              cua,
              "        \"paths\".into(),\n"
              "        Value::Array(files.iter().map(|path| json!(path.as_str())).collect()),\n",
              "        \"files\".into(),\n"
              "        Value::Array(files.iter().map(|path| json!(path.as_str())).collect()),\n",
          )
          replace_once(
              cua,
              "        assert_eq!(call.arguments()[\"paths\"], json!([\"/tmp/proven-upload.txt\"]));\n",
              "        assert_eq!(call.arguments()[\"files\"], json!([\"/tmp/proven-upload.txt\"]));\n"
              "        assert!(!call.arguments().contains_key(\"paths\"));\n",
          )
          PY

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0

      - name: Format
        run: cargo fmt

      - name: Diff check
        run: git diff --check

      - name: Check
        run: cargo check --locked --all-targets

      - name: Targeted heartbeat and upload tests
        run: |
          cargo test --locked heartbeat_ack_deadline_has_a_scheduler_tolerance_floor -- --exact
          cargo test --locked v2_browser_cua::tests::upload_never_accepts_arbitrary_paths_from_the_browser_request -- --exact

      - name: Repeat partition recovery
        run: |
          for i in $(seq 1 20); do
            echo "===== partition iteration $i ====="
            cargo test --locked --test v2_m1_partition_recovery
          done

      - name: Repeat multi-device recovery
        run: |
          for i in $(seq 1 10); do
            echo "===== multi-device iteration $i ====="
            cargo test --locked --test v2_p1_multi_device_e2e
          done

      - name: Full test
        run: cargo test --locked

      - name: Commit verified fixes and remove diagnostics
        run: |
          git rm .github/workflows/v2-session-race-fix.yml \
                 .github/workflows/v2-session-race-diagnostic.yml \
                 .github/workflows/transfer-upload-schema-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v2_m1_agent.rs src/v2_browser_cua.rs
          git commit -m "fix(v2): harden Agent liveness and Cua upload mapping"
          git push origin HEAD:feat/v2-browser-semantic-parity
