name: Online recovery integration gate

on:
  push:
    branches: [feat/local-user-online-recovery]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/local-user-online-recovery

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0

      - name: Apply integration patches
        run: |
          python3 scripts/apply_online_recovery.py
          python3 scripts/harden_online_recovery.py
          python3 scripts/fix_online_recovery_lints.py

      - name: Synchronize lockfile
        run: cargo check --all-targets

      - name: Format
        run: cargo fmt --all

      - name: Check
        run: cargo check --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Diff check
        run: git diff --check

      - name: Commit integrated implementation
        run: |
          git rm scripts/apply_online_recovery.py scripts/harden_online_recovery.py scripts/fix_online_recovery_lints.py .github/workflows/online-recovery-dev.yml
          git add Cargo.toml Cargo.lock src
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat(v2): add local-user-authorized online recovery"
          git push origin HEAD:feat/local-user-online-recovery
