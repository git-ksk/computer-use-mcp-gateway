name: Backend Passthrough Contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  passthrough:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - name: Python syntax
        run: python3 -m py_compile scripts/mock_mcp_backend.py scripts/v1_passthrough_contract.py

      - name: Build gateway
        run: cargo build --locked --bin v1_gateway

      - name: Verify transparent session and identity passthrough
        run: python3 scripts/v1_passthrough_contract.py
