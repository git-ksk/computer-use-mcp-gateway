name: V2 session race diagnostic

on:
  push:
    branches:
      - feat/v2-browser-semantic-parity
    paths:
      - .github/workflows/v2-session-race-diagnostic.yml

jobs:
  repeat-partition-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: feat/v2-browser-semantic-parity
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Repeat partition recovery with backtrace
        env:
          RUST_BACKTRACE: "1"
        run: |
          for i in $(seq 1 20); do
            echo "===== iteration $i ====="
            cargo test --locked --test v2_m1_partition_recovery -- --nocapture
          done
